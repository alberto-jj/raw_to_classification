scalingAndFolding:
  aggregate_folders:
    - 'FeaturesROI@30@prep-defaultprep'
  #  - 'FeaturesChannels@30@prep-defaultprep'
  MAX_FEATURES: null
  path : './data/%PROJECT%/scalingAndFolding'
  random_state : 0
  targets :
    - 'age'
  dropsToOnlyFeatures: # the targets will be appended to this in the script
    - id
    - sex
    - group
    - dataset
    - subject
    - task
  stratifiedvars :
    - dataset
    #- group make it easier to balance for test purposes
    #- sex
  scalings : # dont use _ - in the name (bids-like)
    scalingCombat : # name of this particular scaling config
        method : 'reCombat'
        init:
          parametric : True
          model : 'elastic_net'
          config : 
            alpha : 0.00001
          n_jobs : 7
          verbose : True
        covars :
          - dataset
          - sex
          - age
          #- group # seems we are missing data in testing conditions
        batch : dataset # which should be the one we drop from covars for the design matrix X in combat
        rename : # sync to covars, otherwise design matrix inconsistencies will throw an error
          age : age_numerical
        categorical : # sync to covars, otherwise design matrix inconsistencies will throw an error
          - dataset
          #- group
          - sex
    scalingStandard:
      method : 'StandardScaler'
    # we should implement a none scaling...
    noScaling:
      method: 'noScaling'
  splits : # dont use _ - in the name (bids-like)
    folding:
      method : 'StratifiedKFold'
      num_folds: 5 # stratified by combination by default
    trainTestSplit:
      method : 'train_test_split'
      test_ratio : 0.3
      stratify : True # Based on combination, see script for meaning...
    all :
      method : 'all'
  visualizations:
    PCAviz:
      method : 'PCA'
      n_components : 2
      color_by : dataset
      colormap : 'viridis'
  featurewiz:
    init:
      corr_limit : 0.75
      feature_engg : ''
      category_encoders : ''
      dask_xgboost_flag : False
      nrows : null # Dont use None here
      verbose : 0

ml:
  path: './data/%PROJECT%/ml'
  models:
    automljar :
      method : AutoMLjar
      init :
        algorithms :
          - 'Baseline'
          - 'Linear'
          - 'Decision Tree'
          # - 'Random Forest'
          # - 'Extra Trees'
          - 'LightGBM'
          - 'Xgboost'
          - 'CatBoost'
          # - 'Neural Network'
          # - 'Nearest Neighbors'
        explain_level : 1
        ml_task : 'auto'
        mode : Explain
        eval_metric : 'rmse'
        validation_strategy : 
          validation_type : custom
        model_time_limit : 3600
        n_jobs : 1

    autogluon:
      method: AutoGluon
      init:
        problem_type: 'regression'
        eval_metric: 'root_mean_squared_error'
        verbosity: 2
        log_to_file: True
        sample_weight: null
        groups: null
      fit :
        tuning_data : null
        time_limit : null
        presets : null
        hyperparameters : null
        feature_metadata : 'infer'
        infer_limit : null 
        infer_limit_batch_size : null
        fit_weighted_ensemble : True
        fit_full_last_level_weighted_ensemble : True
        full_weighted_ensemble_additionally  : False
        dynamic_stacking : False
        calibrate_decision_threshold : False
        num_cpus : 10
        num_gpus : auto
        num_bag_folds : 0

eda:
  path: './data/%PROJECT%/eda'
  
  # ols
  category_vars:
    - dataset
    - sex
  desired_threshold: 0.05
  formula: "{feature} ~ C(group, Treatment(reference='HC')) + age + sex"

  # plot based on feature type (1st level)
  # define functions (or a map-dictionary)
  feature_categories:
      by_band :
        category_name : byband
        category_mapping: |
          def category_mapping(x):
            for b in ['pre_alpha','alpha','beta','gamma','delta','slow_theta','theta']:
                if b in x:
                    return b
            else:
                return 'NoBand'
        input_column_mapping : Feature
        color_map:
          pre_alpha : blue
          alpha : green
          beta : yellow
          gamma : orange
          delta : red
          slow_theta : magenta
          theta : brown
          NoBand : black
      by_ROI :
        category_name : band
        category_mapping: |
          def category_mapping(x):
            for b in ['pre_alpha','alpha','beta','gamma','delta','slow_theta','theta']:
                if b in x:
                    return b
            else:
                return 'NoBand'
        input_column_mapping : Feature
        color_map:
          pre_alpha : blue
          alpha : green
          beta : yellow
          gamma : orange
          delta : red
          slow_theta : magenta
          theta : brown
          NoBand : black

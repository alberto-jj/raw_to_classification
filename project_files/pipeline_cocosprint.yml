project: 'cocosprint'
datasets_file: 'project_files/datasets_cocosprint.yml'
mount: computecanada
0_inspect:
  path : './data/%PROJECT%/inspect'
1_dataset2bids:
  redefine_bidsify:
    from_this: project_files.redefinitions_cocosprint
    import_that: bidsify

3_preprocess:
  prep_cfg:
    prepDur30Ov15: # This is the name of the preprocessing pipeline
      redefine_prepare:
        from_this: project_files.redefinitions_cocosprint
        import_that: prepare
      prepare:
        epoch_config:
          duration: 30
          overlap: 15
      overwrite : False
  prep_list :
    - prepDur30Ov15

prep_inspection:
  path : './data/%PROJECT%/prep_inspection'
  overwrite : False
  checks:
    - 'epochs'
  prep_list :
    - prepDur30Ov15

4_features:
  path_inspection : './data/%PROJECT%/feature_inspection'

  feature_pipeline_cfg:
    features@prepDur30Ov15: #you set the name of the feature pipeline with the key
      prep_pipeline : 'prepDur30Ov15' # This is the name of the preprocessing pipeline previously defined (must exist in derivatives)
      downsample : null
      prefilter : null
      keep_channels : False
      standardize_epochs : False
      feature_list: # To say which features actually compute rather than configure
        # - RateEntropy
        - FisherInformationMeanEpochs
        - FisherInformationSDEpochs
        - HarmonicityMeanEpochs
        - HarmonicitySDEpochs
        # - detrendedFluctuationMeanEpochs
        # - detrendedFluctuationSDEpochs
        # # - hjorthParams
        # - hjorthMobilityMeanEpochs
        # - hjorthMobilitySDEpochs
        # - hjorthComplexityMeanEpochs
        # - hjorthComplexitySDEpochs
        # - numZerocrossMeanEpochs
        # - numZerocrossSDEpochs
        # - svdEntropyMeanEpochs
        # - svdEntropySDEpochs
        # - higuchiFdMeanEpochs
        # - higuchiFdSDEpochs
        # - higuchiFdVarEpochs
        # - katzFdMeanEpochs
        # - katzFdSDEpochs
        # - petrosianFdMeanEpochs
        # - petrosianFdSDEpochs
        # # # - entropyMultiscaleMeanEpochs
        # # #- sampleEntropyMeanEpochs
        #   #- permEntropyMeanEpochs
        # - spectralEntropyMeanEpochs
        # - spectralEntropySDEpochs
        # - lzivComplexityMeanEpochs
        # - lzivComplexitySDEpochs
        # # # - appEntropyMeanEpochs
        # - PowerSpectrum
        # - PowerSpectrumAverage
        # #- RelativeBandPowerFromAverageSpectrum
        # #- FooofFromAverage
        # #- RelativeBandPowerFromAverageFooof

    features@prepSingleEpoch: #you set the name of the feature pipeline with the key
      prep_pipeline : prepSingleEpoch # This is the name of the preprocessing pipeline previously defined (must exist in derivatives)
      downsample : null
      prefilter : null
      keep_channels : False
      standardize_epochs : False
      feature_list: # To say which features actually compute rather than configure
        #- PowerSpectrum
        #- PowerSpectrumAverage
        # #- RelativeBandPowerFromAverageSpectrum
        #- FooofFromAverage
        - PowerSpectrumWelch
        - PowerSpectrumWelchAverage
        - FooofFromAverageWelch

  feature_pipeline_list: #which feature pipelines to run
    - features@prepDur30Ov15
  feature_cfg: # You can configure different features for the same function but different args
    # The suffix will be the higher hierarchy name you put here

    Harmonicity: 
      overwrite: False
      chain:
        - feature: PowerSpectrum
        - function: feature_harmonicity
          args:
            distance: null
            height: null
            bands: null

    HarmonicityMeanEpochs:
      overwrite: True
      chain:
        - feature: Harmonicity
        - function: process_harmonicity_output
          args: {}
        - function: agg_numpy
          args:
            numpyfun: eval%np.nanmean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    HarmonicitySDEpochs:
      overwrite: True
      chain:
        - feature: Harmonicity
        - function: process_harmonicity_output
          args: {}
        - function: agg_numpy
          args:
            numpyfun: eval%np.nanstd
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    RateEntropy:
      overwrite: False
      chain:
        - function: rate_entropy_feature
          args:
              kmax: 10

    FisherInformation:
      overwrite: False
      chain:
        - function: fisher_information_feature
          args:
            delay: 1
            dimension: 3

    FisherInformationMeanEpochs:
      overwrite: False
      chain:
        - feature: FisherInformation
        - function: agg_numpy
          args:
            numpyfun: eval%np.nanmean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'
    
    FisherInformationSDEpochs:
      overwrite: False
      chain:
        - feature: FisherInformation
        - function: agg_numpy
          args:
            numpyfun: eval%np.nanstd
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    Distance2Criticality:
      overwrite: False
      chain:
        - function: chaos_feature
          args:
            sigma: 0.5
            downsample: True

    PowerSpectrum:
      overwrite : False
      chain: # Chain is a list of either dict of defined functions (outputs not saved) or dict of defined features (output saved)
      # input of chain is assumed to be mne epochs unless it first item is directly a feature
      - function : spectrum_multitaper
        args:
          multitaper:
            adaptive : False
            low_bias : True
            normalization : 'full'
            verbose : 0
    PowerSpectrumWelch:
      overwrite : False
      chain:
        - function : spectrum_welch
          args:
            welch:
              n_fft : eval%int(np.round(epochs.info['sfreq']/2))
              n_overlap : eval%int(np.round(epochs.info['sfreq']/4))
              n_per_seg : eval%int(np.round(epochs.info['sfreq']/2))
    PowerSpectrumWelchAverage:
      overwrite : False
      chain:
        - feature : PowerSpectrumWelch
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'

    PowerSpectrumAverage:
      overwrite : False
      chain:
        - feature : PowerSpectrum
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'
    FooofFromAverage:
      overwrite : False
      chain:
        - feature : PowerSpectrumAverage
        - function : spectrum_keep_magnetometers
          args:
            dummy : None
        - function : fooof_from_average
          args :
            internal_kwargs:
              FOOOF:
                aperiodic_mode : knee
              fit:
                freq_range : [1,90]
              freq_res : 0.2

    FooofFromAverageWelch:
      overwrite : False
      chain:
        - feature : PowerSpectrumWelchAverage
        - function : fooof_from_average
          args :
            internal_kwargs:
              FOOOF:
                aperiodic_mode : knee
              fit:
                freq_range : [1,90]

    RelativeBandPowerFromAverageSpectrum:
      overwrite : False
      chain :
        - feature : PowerSpectrumAverage # this will save PowerSpectrum if not already saved
        - function: relative_bandpower
          args :
            bands:
              delta : [1,4]
              theta : [4,8]
              alpha : [8,13]
              beta  : [13,30]
              gamma : [30,90]
    RelativeBandPowerFromAverageFooof:
      overwrite : False
      chain:
        - feature : FooofFromAverage
        - function: relative_bandpower_from_fooof
          args :
            bands:
              delta : [1,4]
              theta : [4,8]
              alpha : [8,13]
              beta  : [13,30]
              gamma : [30,90]
    detrendedFluctuation:
      overwrite: False
      chain:
        - function: compute_detrendedFluctuation
          args:
            internal_kwargs:
              detrended_fluctuation : {}
    detrendedFluctuationMeanEpochs:
      overwrite: False
      chain:
        - feature: detrendedFluctuation
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'

    detrendedFluctuationSDEpochs:
      overwrite: False
      chain:
        - feature: detrendedFluctuation
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null
            axisname: 'epochs'

    lzivComplexity:
      overwrite: False
      chain:
        - function: compute_lzivComplexity
          args:
            prefoo : "eval%lambda x: (x > np.median(x)).astype(int)"
            internal_kwargs:
              lziv_complexity :
                normalize: True
    lzivComplexityMeanEpochs:
      overwrite: False
      chain:
        - feature: lzivComplexity
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'
    lzivComplexitySDEpochs:
      overwrite: False
      chain:
        - feature: lzivComplexity
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null
            axisname: 'epochs'


    sampleEntropy:
      overwrite: False
      chain:
        - function: compute_sampleEntropy
          args:
            internal_kwargs:
              sample_entropy :
                order : 2
                metric : chebyshev
    sampleEntropyMeanEpochs:
      overwrite: False
      chain:
        - feature: sampleEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'
    sampleEntropySDEpochs:
      overwrite: False
      chain:
        - feature: sampleEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null
            axisname: 'epochs'

    spectralEntropy:
      overwrite: False
      chain:
        - function: compute_spectralEntropy
          args:
            internal_kwargs:
              spectral_entropy :
                sf : eval%eeg.info['sfreq']
                method : 'welch'
                nperseg : eval%int(np.round(eeg.info['sfreq']/1))
                normalize : True

    spectralEntropyMeanEpochs:
      overwrite: False
      chain:
        - feature: spectralEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'
    spectralEntropySDEpochs:
      overwrite: False
      chain:
        - feature: spectralEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null
            axisname: 'epochs'

    appEntropy:
      overwrite: False
      chain:
        - function: compute_appEntropy
          args:
            internal_kwargs:
              app_entropy :
                order : 2
                metric : chebyshev

    appEntropyMeanEpochs:
      overwrite: False
      chain:
        - feature: appEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null
            axisname: 'epochs'
    appEntropySDEpochs:
      overwrite: False
      chain:
        - feature: appEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null
            axisname: 'epochs'

    hjorthParams:
      overwrite: False
      chain:
        - function: compute_hjorthParams
          args:
            internal_kwargs:
              hjorth_params: {}

    hjorthMobility:
      overwrite: False
      chain:
        - feature: hjorthParams
        - function: extract_item
          args:
            fun: "eval%lambda x: x[0]"
            newtype: hjorthMobility

    hjorthMobilityMeanEpochs:
      overwrite: False
      chain:
        - feature: hjorthMobility
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    hjorthMobilitySDEpochs:
      overwrite: False
      chain:
        - feature: hjorthMobility
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    hjorthComplexity:
      overwrite: False
      chain:
        - feature: hjorthParams
        - function: extract_item
          args:
            fun: "eval%lambda x: x[1]"
            newtype: hjorthComplexity

    hjorthComplexityMeanEpochs:
      overwrite: False
      chain:
        - feature: hjorthComplexity
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    hjorthComplexitySDEpochs:
      overwrite: False
      chain:
        - feature: hjorthComplexity
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    numZerocross:
      overwrite: False
      chain:
        - function: compute_numZerocross
          args:
            internal_kwargs:
              num_zerocross:
                normalize: True

    numZerocrossMeanEpochs:
      overwrite: False
      chain:
        - feature: numZerocross
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    numZerocrossSDEpochs:
      overwrite: False
      chain:
        - feature: numZerocross
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    permEntropy:
      overwrite: False
      chain:
        - function: compute_permEntropy
          args:
            internal_kwargs:
              perm_entropy:
                order: 3
                delay: 1
                normalize: True

    permEntropyMeanEpochs:
      overwrite: False
      chain:
        - feature: permEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    permEntropySDEpochs:
      overwrite: False
      chain:
        - feature: permEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    svdEntropy:
      overwrite: False
      chain:
        - function: compute_svdEntropy
          args:
            internal_kwargs:
              svd_entropy:
                order: 3
                delay: 1
                normalize: True

    svdEntropyMeanEpochs:
      overwrite: False
      chain:
        - feature: svdEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    svdEntropySDEpochs:
      overwrite: False
      chain:
        - feature: svdEntropy
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    higuchiFd:
      overwrite: False
      chain:
        - function: compute_higuchiFd
          args:
            internal_kwargs:
              higuchi_fd:
                kmax: 10

    higuchiFdMeanEpochs:
      overwrite: False
      chain:
        - feature: higuchiFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    higuchiFdSDEpochs:
      overwrite: False
      chain:
        - feature: higuchiFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    higuchiFdVarEpochs:
      overwrite: False
      chain:
        - feature: higuchiFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.var
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    katzFd:
      overwrite: False
      chain:
        - function: compute_katzFd
          args:
            internal_kwargs:
              katz_fd: {}

    katzFdSDEpochs:
      overwrite: False
      chain:
        - feature: katzFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    katzFdMeanEpochs:
      overwrite: False
      chain:
        - feature: katzFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    petrosianFd:
      overwrite: False
      chain:
        - function: compute_petrosianFd
          args:
            internal_kwargs:
              petrosian_fd: {}

    petrosianFdMeanEpochs:
      overwrite: False
      chain:
        - feature: petrosianFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    petrosianFdSDEpochs:
      overwrite: False
      chain:
        - feature: petrosianFd
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    entropyMultiscale: #TODO: i think the aggregation wont work here because multiscale return a complex datatype, check this
      overwrite: False
      chain:
        - function: compute_entropyMultiscale
          args:
            internal_kwargs:
              entropy_multiscale:
                scale : "default"
                dimension : 3
                tolerance : "sd"
                method : "MSEn"
                show : False

    entropyMultiscaleSingle: #TODO: i think the aggregation wont work here because multiscale return a complex datatype, check this
      overwrite: False
      chain:
        - feature: entropyMultiscale
        - function: extract_item
          args:
            fun: "eval%lambda x: x[0]"
            newtype: null

    entropyMultiscaleMeanEpochs:
      overwrite: False
      chain:
        - feature: entropyMultiscaleSingle
        - function: agg_numpy
          args:
            numpyfun: eval%np.mean
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

    entropyMultiscaleSDEpochs:
      overwrite: False
      chain:
        - feature: entropyMultiscaleSingle
        - function: agg_numpy
          args:
            numpyfun: eval%np.std
            max_numitem: null # 20min at 5sec per epoch
            axisname: 'epochs'

aggregate:
  path : 
    computecanada: '/home/yorguin/scratch/%PROJECT%/aggregate/' #
    local: './data/%PROJECT%/aggregate/'
  filename : 'aggregate'
  id_splitter : '/'
  feature_return:
    BandRatiosFromAverageFooof: # Could be the original name or a post-processed name
      return_function : "eval%lambda x: x"
      file_suffix : BandRatiosFromAverageFooof
    BandRatiosFromAverageSpectrum: # Could be the original name or a post-processed name
      return_function : "eval%lambda x: x"
      file_suffix : BandRatiosFromAverageSpectrum
    fooofExponent:
      return_function : "eval%lambda x: x.aperiodic_params_[-1]"
      file_suffix : FooofFromAverage
    fooofOffset:
      return_function : "eval%lambda x: x.aperiodic_params_[0]"
      file_suffix : FooofFromAverage
    fooofExponentWelch:
      return_function : "eval%lambda x: x.aperiodic_params_[-1]"
      file_suffix : FooofFromAverageWelch
    fooofOffsetWelch:
      return_function : "eval%lambda x: x.aperiodic_params_[0]"
      file_suffix : FooofFromAverageWelch
    RelativeBandPowerFromAverageFooof:
      return_function : "eval%lambda x: x"
      file_suffix : RelativeBandPowerFromAverageFooof
    RelativeBandPowerFromAverageSpectrum:
      return_function : "eval%lambda x: x"
      file_suffix : RelativeBandPowerFromAverageSpectrum
    appEntropyMeanEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : appEntropyMeanEpochs
    appEntropySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : appEntropySDEpochs
    entropyMultiscaleMeanEpochs:
      return_function: "eval%lambda x: x"
      file_suffix : entropyMultiscaleMeanEpochs
    entropyMultiscaleSDEpochs:
      return_function: "eval%lambda x: x"
      file_suffix : entropyMultiscaleSDEpochs
    higuchiFdMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : higuchiFdMeanEpochs
    higuchiFdVarEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : higuchiFdVarEpochs
    higuchiFdSDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : higuchiFdSDEpochs
    hjorthMobilityMeanEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : hjorthMobilityMeanEpochs
    hjorthMobilitySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : hjorthMobilitySDEpochs
    hjorthComplexityMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : hjorthComplexityMeanEpochs
    hjorthComplexitySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : hjorthComplexitySDEpochs
    katzFdMeanEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : katzFdMeanEpochs
    katzFdSDEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : katzFdSDEpochs
    lzivComplexityMeanEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : lzivComplexityMeanEpochs
    lzivComplexitySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : lzivComplexitySDEpochs
    numZerocrossMeanEpochs: 
      return_function : "eval%lambda x: x"
      file_suffix : numZerocrossMeanEpochs
    numZerocrossSDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : numZerocrossSDEpochs
    detrendedFluctuationMeanEpochs: # no text
      return_function : "eval%lambda x: x" # this uses the first 2 epochs of the 10min epoch
      file_suffix : detrendedFluctuationMeanEpochs
    detrendedFluctuationSDEpochs: # no text
      return_function : "eval%lambda x: x" # this uses the first 2 epochs of the 10min epoch
      file_suffix : detrendedFluctuationSDEpochs
    sampleEntropyMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : sampleEntropyMeanEpochs
    sampleEntropySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : sampleEntropySDEpochs
    spectralEntropyMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : spectralEntropyMeanEpochs
    spectralEntropySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : spectralEntropySDEpochs
    permEntropyMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : permEntropyMeanEpochs
    permEntropySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : permEntropySDEpochs
    svdEntropyMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : svdEntropyMeanEpochs
    svdEntropySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : svdEntropySDEpochs
    petrosianFdMeanEpochs : 
      return_function : "eval%lambda x: x"
      file_suffix : petrosianFdMeanEpochs
    petrosianFdSDEpochs :
      return_function : "eval%lambda x: x"
      file_suffix : petrosianFdSDEpochs
    HarmonicityMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : HarmonicityMeanEpochs
    HarmonicitySDEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : HarmonicitySDEpochs
    FisherInformationMeanEpochs:
      return_function : "eval%lambda x: x"
      file_suffix : FisherInformationMeanEpochs
    FisherInformationSDEpochs:
      return_function : "eval%lambda x: x"

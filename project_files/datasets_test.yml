matchingpennies:
  dataset_label : matchingpennies
  skip : False

  bidsify: null
  # Participants 
  participants:
    as_is : False # Do not change the participants file
    participants_file :
      remote: ""
      local: "Y:/datasets/eeg_matchingpennies/participants.tsv"
    reader : 
      function : "pd.read_csv"
      args : 
        delimiter: "\\t"
    df_transform : "group=df['participant_id'].apply(lambda x: 'HC');df['group'] = group;" # all are healthy

    columns:
      participant_id : subject
      group : group
      age : age
      sex : sex
    columns_mapping:
      sex:
        m : M
        f : F
      subject : "lambda x: x.replace('sub-','')"

    cleaned_participants : 
      remote: ""
      local: "Y:/datasets/eeg_matchingpennies/participants_clean.tsv"


  # Processing
  example_file: 
    computecanada: "/home/yorguin/scratch/data/MEG_LSDV2/meg_data_BIDS/sub-*/ses-*/meg/sub-*_ses-*_task-*_meg.fif"
    remote: ""
    local: "Y:/datasets/eeg_matchingpennies/sub-*/**/*_eeg.vhdr"
  ch_names: None
  PowerLineFrequency : 50
  # BIDS
  bids_root :
    remote: ""
    local: "Y:/datasets/eeg_matchingpennies"

  derivatives_root : 
    remote: ""
    local: "Y:/datasets/eeg_matchingpennies/derivatives"

  # Files to be included in the study
  bids_layout:
    extension: ".vhdr"
    suffix : 'eeg'
    return_type : 'filename'


